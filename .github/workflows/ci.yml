name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests on the code as committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  mutant:
    name: same tests with the client check removed (must fail on the expected test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run mutant
  secrets:
    name: secrets scanner (repo clean, planted key refused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks && rm gl.tgz && sudo mv gitleaks /usr/local/bin/
      - name: The repository and its history hold no secret
        run: gitleaks git --redact --no-banner .
      - name: A planted key is refused
        run: |
          mkdir -p /tmp/planted
          key="AKIA$(LC_ALL=C tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)"
          printf 'aws_access_key_id = %s\n' "$key" > /tmp/planted/config.ts
          if gitleaks dir --redact --no-banner /tmp/planted; then
            echo "scanner let a planted key through"; exit 1
          fi
          echo "planted key refused, as expected"
